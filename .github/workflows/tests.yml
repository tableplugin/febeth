name: Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run simulation tests (js-simulate)
        run: node node_modules/mocha/bin/mocha js-simulate/*.js

      - name: Run smart contract tests (truffle test)
        env:
          DEV_MNEMONIC: test test test test test test test test test test test junk
        run: npx truffle test
