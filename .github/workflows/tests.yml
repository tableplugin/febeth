name: Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run simulation tests (js-simulate)
        run: pnpm exec mocha js-simulate/*.js

      - name: Run smart contract tests (truffle test)
        env:
          DEV_MNEMONIC: test test test test test test test test test test test junk
        run: pnpm exec truffle test
